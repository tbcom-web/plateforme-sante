name: publier-site
# Titre du run avec l'identifiant du site : le back-office retrouve ainsi la publication d'un site encore en file d'attente
# (suivi des étapes, apps/admin/src/lib/suivi-publication.ts). Ignoré quand le workflow est appelé par « publier-sites ».
run-name: publier-site ${{ inputs.mode || 'production' }} ${{ inputs.site_id }}

# Déclenché par le bouton « Publier » du back-office (API GitHub workflow_dispatch),
# ou appelé par « publier-sites » pour une publication groupée (propagation d'un changement partagé).
# mode « production » : site public ; mode « apercu » : brouillon pour l'éditeur visuel, sur la branche
# Cloudflare « apercu » (https://apercu.<slug>.pages.dev), jamais indexé, statut du site inchangé.
on:
  workflow_dispatch:
    inputs:
      site_id:
        description: Identifiant du site dans Supabase (uuid)
        required: true
        type: string
      mode:
        description: production ou apercu
        required: false
        default: production
        type: string
  workflow_call:
    inputs:
      site_id:
        required: true
        type: string
      mode:
        required: false
        default: production
        type: string
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_SECRET_KEY:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

# Une seule publication à la fois par site et par mode ; la plus récente gagne.
concurrency:
  group: publier-${{ inputs.site_id }}-${{ inputs.mode }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_ID: ${{ inputs.site_id }}
      APERCU: ${{ inputs.mode == 'apercu' && '1' || '' }}
      # Lien de l'exécution, enregistré dans Supabase pour le suivi de publication (back-office).
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # En production : publication « en cours » dans Supabase (la version construite est config_publiee).
      - name: Préparer (slug du site, suivi de publication)
        id: prep
        working-directory: apps/sites
        run: |
          slug=$(node scripts/publication.mjs preparer "$SITE_ID")
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      # Journal conservé pour expliquer un éventuel échec (ex. « Publication refusée » d'un site incomplet).
      # PUBLICATION_VERSION / PUBLICATION_RUN : écrits dans /version.json du site, que le back-office relit pour
      # n'annoncer « publié » qu'une fois la nouvelle version réellement servie en ligne.
      - name: Construire le site
        if: steps.prep.outputs.suspendu != '1'
        shell: bash
        env:
          PUBLICATION_VERSION: ${{ steps.prep.outputs.version }}
          PUBLICATION_RUN: ${{ github.run_id }}
        run: npm run build -w apps/sites 2>&1 | tee "$RUNNER_TEMP/construction.log"

      # Version d'essai suspendue ou terminée (docs/onboarding-lead.md) : l'aperçu est remplacé par une page sobre, noindex.
      - name: Construire la page de version d'essai suspendue
        if: steps.prep.outputs.suspendu == '1'
        working-directory: apps/sites
        run: node scripts/publication.mjs page-suspendue "$SITE_ID" dist

      - name: Créer le projet Cloudflare Pages si besoin
        working-directory: apps/sites
        run: npx wrangler pages project create "${{ steps.prep.outputs.slug }}" --production-branch main || true

      - name: Déployer sur Cloudflare Pages
        working-directory: apps/sites
        run: npx wrangler pages deploy dist --project-name "${{ steps.prep.outputs.slug }}" --branch "${{ inputs.mode == 'apercu' && 'apercu' || 'main' }}" --commit-dirty=true

      - name: Publication réussie (site en ligne, sauf site suspendu)
        if: inputs.mode != 'apercu'
        working-directory: apps/sites
        run: node scripts/publication.mjs terminer "$SITE_ID" "${{ steps.prep.outputs.slug }}.pages.dev"

      # Version d'essai (aperçu privé, jamais la production) : prête, le back-office affiche « Voir mon site ».
      - name: Publication réussie (version d'essai en aperçu)
        if: inputs.mode == 'apercu' && steps.prep.outputs.essai == '1'
        working-directory: apps/sites
        run: node scripts/publication.mjs terminer-apercu "$SITE_ID"

      # Une étape a échoué : la publication passe « en échec » dans le back-office (pastille, lien, « Réessayer »).
      - name: Signaler l'échec de la publication
        if: failure() && (inputs.mode != 'apercu' || steps.prep.outputs.essai == '1')
        working-directory: apps/sites
        run: node scripts/publication.mjs echec "$SITE_ID" "$RUNNER_TEMP/construction.log"
