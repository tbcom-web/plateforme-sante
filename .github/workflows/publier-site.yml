name: publier-site

# Déclenché par le bouton « Publier » du back-office (API GitHub workflow_dispatch),
# ou appelé par « publier-sites » pour une publication groupée (propagation d'un changement partagé).
# mode « production » : site public ; mode « apercu » : brouillon pour l'éditeur visuel, sur la branche
# Cloudflare « apercu » (https://apercu.<slug>.pages.dev), jamais indexé, statut du site inchangé.
on:
  workflow_dispatch:
    inputs:
      site_id:
        description: Identifiant du site dans Supabase (uuid)
        required: true
        type: string
      mode:
        description: production ou apercu
        required: false
        default: production
        type: string
  workflow_call:
    inputs:
      site_id:
        required: true
        type: string
      mode:
        required: false
        default: production
        type: string
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_SECRET_KEY:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

# Une seule publication à la fois par site et par mode ; la plus récente gagne.
concurrency:
  group: publier-${{ inputs.site_id }}-${{ inputs.mode }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_ID: ${{ inputs.site_id }}
      APERCU: ${{ inputs.mode == 'apercu' && '1' || '' }}
      # Lien de l'exécution, enregistré dans Supabase pour le suivi de publication (back-office).
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # En production : publication « en cours » dans Supabase (la version construite est config_publiee).
      - name: Préparer (slug du site, suivi de publication)
        id: prep
        working-directory: apps/sites
        run: |
          slug=$(node scripts/publication.mjs preparer "$SITE_ID")
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      # Journal conservé pour expliquer un éventuel échec (ex. « Publication refusée » d'un site incomplet).
      - name: Construire le site
        shell: bash
        run: npm run build -w apps/sites 2>&1 | tee "$RUNNER_TEMP/construction.log"

      - name: Créer le projet Cloudflare Pages si besoin
        working-directory: apps/sites
        run: npx wrangler pages project create "${{ steps.prep.outputs.slug }}" --production-branch main || true

      - name: Déployer sur Cloudflare Pages
        working-directory: apps/sites
        run: npx wrangler pages deploy dist --project-name "${{ steps.prep.outputs.slug }}" --branch "${{ inputs.mode == 'apercu' && 'apercu' || 'main' }}" --commit-dirty=true

      - name: Publication réussie (site en ligne, sauf site suspendu)
        if: inputs.mode != 'apercu'
        working-directory: apps/sites
        run: node scripts/publication.mjs terminer "$SITE_ID" "${{ steps.prep.outputs.slug }}.pages.dev"

      # Une étape a échoué : la publication passe « en échec » dans le back-office (pastille, lien, « Réessayer »).
      - name: Signaler l'échec de la publication
        if: failure() && inputs.mode != 'apercu'
        working-directory: apps/sites
        run: node scripts/publication.mjs echec "$SITE_ID" "$RUNNER_TEMP/construction.log"
