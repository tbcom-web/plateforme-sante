name: tester-modele
# Titre du run avec le modèle et la version : l'admin retrouve ainsi le passage d'un modèle encore en file d'attente.
run-name: tester-modele ${{ inputs.modele || 'hebdomadaire' }} v${{ inputs.version || '-' }} ${{ inputs.mode || 'check' }}

# TESTEUR DE MODÈLES (docs/testeur-modeles.md) : construit le site du modèle pour CHAQUE jeu de démonstration (un profil par
# famille de thèmes compatibles, champ « jeux » de retours/modeles-a-tester.json ; sinon 3 jeux historiques) et passe
# tous les contrôles (npm run tester:modele). Résultat écrit dans le dépôt par le bot (retours/tests-modeles/<modele>-v<n>.json,
# vignettes, et retours/tests-modeles.json lu par la chaîne des modèles), captures en artefact du run.
# Déclenchement : à la main (Actions → tester-modele → Run workflow) ou par l'admin (fonction declencherTestModele, API
# workflow_dispatch, comme la publication). Aucune publication, aucun site mis en ligne.
#
# RE-TEST HEBDOMADAIRE des modèles publiés : DÉSACTIVÉ par défaut. Pour l'activer, décommenter le bloc « schedule » ci-dessous :
# le job lit la liste des modèles publiés dans retours/tests-modeles/a-retester.json ([{ "modele": "<id>", "version": n }],
# tenue par la chaîne) et teste chacun (mode check). Coût : ~10 min de runner par modèle.
on:
  workflow_dispatch:
    inputs:
      modele:
        description: Identifiant du modèle (recette du studio ou modèle intégré)
        required: true
        type: string
      version:
        description: Version du modèle testée
        required: false
        default: '1'
        type: string
      mode:
        description: check (finaliste) ou recheck (nouvelle version après retouche)
        required: false
        default: check
        type: string
      jeux:
        description: Profils de démonstration séparés par des virgules (vide = champ « jeux » de retours/modeles-a-tester.json)
        required: false
        default: ''
        type: string
  # schedule:
  #   - cron: '23 4 * * 1'   # lundi 4 h 23 UTC

# Un seul passage à la fois par modèle ; un passage plus récent du même modèle attend la fin du précédent (pas d'annulation).
concurrency:
  group: tester-modele-${{ inputs.modele || 'hebdomadaire' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tester:
    runs-on: ubuntu-latest
    # Un passage par jeu de démonstration (profil) : ~1,5 à 2 min par jeu, 7 familles au plus
    timeout-minutes: 60
    env:
      # Lecture de la recette dans la table recettes (clé service déjà en secret, jamais affichée : le script ne l'écrit nulle part)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      MODELE: ${{ inputs.modele }}
      VERSION: ${{ inputs.version }}
      MODE: ${{ inputs.mode }}
      JEUX: ${{ inputs.jeux }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Navigateurs (Chromium, WebKit)
        run: npx playwright install --with-deps chromium webkit

      - name: Tester le modèle
        shell: bash
        # Captures et journaux écrits dans le dossier temporaire du runner : autorisé explicitement (garde-fou de chemins.mjs)
        env:
          SORTIES_AUTORISEES: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # Entrées contrôlées (jamais interpolées telles quelles dans le shell)
          [[ "${MODELE:-}" =~ ^[A-Za-z0-9_-]{1,80}$ ]] || [ "${{ github.event_name }}" = "schedule" ] || { echo "Identifiant de modèle invalide."; exit 1; }
          [[ "${VERSION:-1}" =~ ^[0-9]{1,4}$ ]] || { echo "Version invalide."; exit 1; }
          [[ "${MODE:-check}" =~ ^(check|recheck)$ ]] || { echo "Mode invalide."; exit 1; }
          [[ "${JEUX:-}" =~ ^[a-z0-9~.+_,-]{0,400}$ ]] || { echo "Jeux invalides."; exit 1; }
          OPT_JEUX=()
          [ -n "${JEUX:-}" ] && OPT_JEUX=(--jeux "$JEUX")
          if [ "${{ github.event_name }}" = "schedule" ]; then
            liste=retours/tests-modeles/a-retester.json
            [ -f "$liste" ] || { echo "Aucun modèle publié à re-tester ($liste absent)."; exit 0; }
            node -e 'for (const m of JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))) if (/^[A-Za-z0-9_-]{1,80}$/.test(m.modele) && Number.isInteger(m.version)) console.log(`${m.modele} ${m.version}`)' "$liste" |
            while read -r m v; do
              npm run tester:modele -- --modele "$m" --version "$v" --sortie "$RUNNER_TEMP/testeur/$m-v$v" || echo "Échec du passage $m v$v"
            done
          else
            # Échec : les dernières lignes deviennent une annotation (lisible sans compte GitHub, et par l'admin via l'API publique)
            mkdir -p "$RUNNER_TEMP/testeur"
            if ! npm run tester:modele -- --modele "$MODELE" --version "${VERSION:-1}" --mode "${MODE:-check}" "${OPT_JEUX[@]}" --sortie "$RUNNER_TEMP/testeur/$MODELE-v${VERSION:-1}" 2>&1 | tee "$RUNNER_TEMP/testeur/journal.log"; then
              msg=$(grep -v '^\s*$' "$RUNNER_TEMP/testeur/journal.log" | grep -iv 'secret\|apikey\|bearer' | tail -n 12 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=Testeur de modèles::${msg}"
              exit 1
            fi
          fi

      - name: Captures et résultats (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testeur-${{ inputs.modele || 'hebdomadaire' }}-v${{ inputs.version || '1' }}
          path: |
            ${{ runner.temp }}/testeur/**/captures/**
            ${{ runner.temp }}/testeur/**/webkit/**
            ${{ runner.temp }}/testeur/**/resultat.json
            ${{ runner.temp }}/testeur/**/*.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Enregistrer le résultat dans le dépôt (bot)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add retours/tests-modeles/ retours/tests-modeles.json
          if git diff --cached --quiet; then
            echo "Aucun résultat à enregistrer."
            exit 0
          fi
          git commit -m "Testeur de modèles : ${MODELE:-re-test hebdomadaire} v${VERSION:-} (${MODE:-check})"
          for essai in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
