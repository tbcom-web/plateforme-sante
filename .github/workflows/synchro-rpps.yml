name: synchro-rpps

# Prospection (docs/prospection-rpps.md) : chaque nuit, extraction publique du RPPS (ANS) → table prospection_praticiens, puis
# dates d'installation (API Recherche d'entreprises). Aussi à la main : Actions → synchro-rpps → Run workflow.
# Le dépôt est public, donc les journaux aussi : le script n'y écrit que des comptes, jamais de nom.
# Le premier passage (environ 15 000 vérifications SIRET) dure environ une heure ; les suivants, quelques minutes.
on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
    inputs:
      professions:
        description: 'Codes profession TRE_G15 séparés par des virgules (80 = pédicure-podologue, 70 = masseur-kinésithérapeute)'
        default: '80'

concurrency:
  group: synchro-rpps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  synchro:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Facultatif : date de modification des situations d'exercice (API FHIR de l'ANS, migration 0056)
      ANNUAIRE_SANTE_API_KEY: ${{ secrets.ANNUAIRE_SANTE_API_KEY || secrets.ESANTE_API_KEY }}
      PROFESSIONS: ${{ inputs.professions || '80' }}
      # Autorité racine IGC-Santé présentée par service.annuaire.sante.fr (vérification TLS conservée)
      NODE_EXTRA_CA_CERTS: scripts/certificats/igc-sante-racine.pem
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Synchroniser le RPPS et dater les installations
        run: node scripts/synchro-rpps.mjs
